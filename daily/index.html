    <!-- 用户离开页面时改变页面标题 -->
    <script>var normal_title = document.title; document.addEventListener('visibilitychange', function(){if(document.visibilityState=='hidden'){normal_title=document.title;document.title='yyc\'s blog qwq...';}else{document.title=normal_title;}});</script>
    <!-- 移动墨镜 -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const image = document.getElementById("topImage");
        if (!image) return; // 本页无墨镜图片，直接跳过
        let isMoved = false;

        image.addEventListener('click', function() {
            if (isMoved) {
                // 返回原位
                image.classList.remove('moved');
                isMoved = false;
            } else {
                // 移动到新的位置
                image.classList.add('moved');
                isMoved = true;
            }
        })
      })
    </script>

    <script>
        // 导航栏切换功能
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.querySelector('.menu-toggle');
            const navLinksContainer = document.querySelector('.nav-links');

            // 移动端菜单切换
            menuToggle.addEventListener('click', function() {
                navLinksContainer.classList.toggle('active');
            });
            
            // 点击页面其他区域关闭移动菜单
            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768 && 
                    !e.target.closest('.nav-links') && 
                    !e.target.closest('.menu-toggle')) {
                    navLinksContainer.classList.remove('active');
                }
            });
        });
    </script>
